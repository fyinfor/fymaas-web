name: CI

on:
  workflow_dispatch:
    inputs:
      push_to_acr:
        description: 同步推送到阿里云 ACR（国内拉取用，不是镜像加速器）
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '22'

jobs:
  deps:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Deps
        run: scripts/deps
        env:
          LOCK: true
      - name: Archive Modules
        timeout-minutes: 5
        uses: actions/cache/save@v4
        with:
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ github.workspace }}/node_modules

  build-publish:
    needs:
      - deps
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      extra_tags: ${{ steps.version.outputs.extra_tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Unarchive Node Modules
        timeout-minutes: 5
        uses: actions/cache/restore@v4
        with:
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ github.workspace }}/node_modules
      - name: Build
        run: scripts/build
      - name: Determine Version
        id: version
        run: |
          EXTRA_TAGS=""
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            VERSION="latest"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              EXTRA_TAGS="latest"
            fi
          elif [[ "${GITHUB_REF}" == refs/heads/v*-dev ]]; then
            VERSION="${GITHUB_REF#refs/heads/}"
          else
            echo "Not a publish target"
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "extra_tags=${EXTRA_TAGS}"
            echo "image_tags<<EOF"
            echo "ghcr.io/fyinfor/fymaas-web:${VERSION}"
            for t in ${EXTRA_TAGS}; do
              echo "ghcr.io/fyinfor/fymaas-web:${t}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "UI version=${VERSION} extra_tags=${EXTRA_TAGS:-<none>}"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.version.outputs.image_tags }}
      - name: Package
        run: scripts/package
        env:
          VERSION: '${{ steps.version.outputs.version }}'
      - name: Publish UI GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-${{ steps.version.outputs.version }}
          name: fymaas-web ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.version == 'latest' || contains(steps.version.outputs.version, '-dev') }}
          make_latest: false
          files: dist/${{ steps.version.outputs.version }}.tar.gz
      - name: Check Tencent COS secrets
        id: cos
        env:
          SID: ${{ secrets.CI_TECENTCOS_SECRET_ID }}
        run: |
          if [[ -n "${SID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to Tencent COS
        if: steps.cos.outputs.enabled == 'true'
        uses: TencentCloud/cos-action@b0aa648235fb35a1bdd6a77f529eb0ac4c2f1c25
        with:
          secret_id: ${{ secrets.CI_TECENTCOS_SECRET_ID }}
          secret_key: ${{ secrets.CI_TECENTCOS_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}
          cos_region: ${{ secrets.COS_REGION }}
          local_path: dist/${{ steps.version.outputs.version }}.tar.gz
          remote_path: releases/${{ steps.version.outputs.version }}.tar.gz
          accelerate: true
          clean: false

  push-acr:
    needs: build-publish
    if: ${{ inputs.push_to_acr }}
    uses: ./.github/workflows/push-acr.yaml
    secrets: inherit
    with:
      image: fymaas-web
      tag: ${{ needs.build-publish.outputs.version }}
      extra_tags: ${{ needs.build-publish.outputs.extra_tags }}
