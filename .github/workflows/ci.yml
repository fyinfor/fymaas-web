name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'main'
      - 'v*-dev'
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - 'main'
      - 'v*-dev'

permissions:
  contents: write
  actions: write

env:
  NODE_VERSION: '22'

jobs:
  deps:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Deps
        run: scripts/deps
        env:
          LOCK: true
      - name: Archive Modules
        timeout-minutes: 5
        uses: actions/cache/save@v4
        with:
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ github.workspace }}/node_modules

  build:
    needs:
      - deps
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Unarchive Node Modules
        timeout-minutes: 5
        uses: actions/cache/restore@v4
        with:
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ github.workspace }}/node_modules
      - name: Build
        run: scripts/build

  build-publish:
    needs:
      - deps
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Unarchive Node Modules
        timeout-minutes: 5
        uses: actions/cache/restore@v4
        with:
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ github.workspace }}/node_modules
      - name: Build
        run: scripts/build
      - name: Determine Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "version=latest" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/heads/v*-dev ]]; then
            echo "version=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          else
            echo "Not a publish target"
            exit 1
          fi
      - name: Package
        run: scripts/package
        env:
          VERSION: '${{ steps.version.outputs.version }}'
      - name: Publish UI GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-${{ steps.version.outputs.version }}
          name: fymaas-web ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.version == 'latest' || contains(steps.version.outputs.version, '-dev') }}
          make_latest: false
          files: dist/${{ steps.version.outputs.version }}.tar.gz
      - name: Check Tencent COS secrets
        id: cos
        env:
          SID: ${{ secrets.CI_TECENTCOS_SECRET_ID }}
        run: |
          if [[ -n "${SID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to Tencent COS
        if: steps.cos.outputs.enabled == 'true'
        uses: TencentCloud/cos-action@b0aa648235fb35a1bdd6a77f529eb0ac4c2f1c25
        with:
          secret_id: ${{ secrets.CI_TECENTCOS_SECRET_ID }}
          secret_key: ${{ secrets.CI_TECENTCOS_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}
          cos_region: ${{ secrets.COS_REGION }}
          local_path: dist/${{ steps.version.outputs.version }}.tar.gz
          remote_path: releases/${{ steps.version.outputs.version }}.tar.gz
          accelerate: true
          clean: false

  trigger-backend:
    needs: build-publish
    if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
    steps:
      - name: Dispatch backend pack
        if: env.DISPATCH_PAT != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: fyinfor/fymaas
          event-type: ui-built
          client-payload: |
            {
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}"
            }
      - name: Skip backend dispatch
        if: env.DISPATCH_PAT == ''
        run: |
          echo "DISPATCH_PAT is not configured; skip cross-repo dispatch to fyinfor/fymaas."
          echo "Trigger the Pack workflow on fyinfor/fymaas manually if a backend image rebuild is needed."
